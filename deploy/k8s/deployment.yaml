apiVersion: apps/v1
kind: Deployment
metadata:
  name: mission-agent-platform
  labels:
    app: mission-agent-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mission-agent-platform
  template:
    metadata:
      labels:
        app: mission-agent-platform
    spec:
      automountServiceAccountToken: false
      containers:
        - name: mission-agent-platform
          image: mission-agent-platform:local
          ports:
            - containerPort: 8000
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          readinessProbe:
            httpGet: { path: /api/stats, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/stats, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
